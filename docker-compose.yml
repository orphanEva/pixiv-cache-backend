# External MySQL is REQUIRED. This compose file never creates a MySQL database/table.
services:
  api:
    build: .
    image: pixiv-cache-backend:local
    env_file: .env
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:18081:8000"
    volumes:
      - ./data:/data/pixiv
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    build: .
    image: pixiv-cache-backend:local
    env_file: .env
    restart: unless-stopped
    command: ["python", "-m", "app.workers.archive_worker"]
    volumes:
      - ./data:/data/pixiv
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30m
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_health.py"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  sync:
    build: .
    image: pixiv-cache-backend:local
    env_file: .env
    environment:
      WORKER_HEARTBEAT_KEY: "${SYNC_WORKER_HEARTBEAT_KEY:-pixiv:sync:worker:healthy}"
    restart: unless-stopped
    command: ["python", "-m", "app.workers.sync_worker"]
    volumes:
      - ./data:/data/pixiv
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_health.py"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  maintenance:
    build: .
    image: pixiv-cache-backend:local
    env_file: .env
    environment:
      WORKER_HEARTBEAT_KEY: "${INTEGRITY_WORKER_HEARTBEAT_KEY:-pixiv:integrity:worker:healthy}"
    restart: unless-stopped
    command: ["python", "-m", "app.workers.integrity_worker"]
    volumes:
      - ./data:/data/pixiv
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_health.py"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
