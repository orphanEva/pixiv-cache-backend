# External MySQL is REQUIRED. This compose file never creates a MySQL database/table.
services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:18081:8000"
    volumes:
      - ./data:/data/pixiv
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
