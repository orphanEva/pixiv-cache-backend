name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q app tests
      - name: Unit tests
        run: pytest -q --ignore=tests/test_mysql_integration.py

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pixiv_cache
          MYSQL_ROOT_PASSWORD: test-in-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-in-ci-only"
          --health-interval=5s --health-timeout=3s --health-retries=25
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=15
    env:
      DATABASE_URL: mysql+asyncmy://root:test-in-ci-only@127.0.0.1:3306/pixiv_cache?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: pytest -q tests/test_mysql_integration.py
