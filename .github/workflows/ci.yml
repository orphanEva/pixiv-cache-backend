name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q app tests scripts
      - run: pytest -q --ignore=tests/test_mysql_integration.py

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-in-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-in-ci-only"
          --health-interval=5s --health-timeout=3s --health-retries=25
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=15
    env:
      DATABASE_URL: mysql+asyncmy://root:test-in-ci-only@127.0.0.1:3306/pixiv_archive?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      CI_MYSQL_ROOT_PASSWORD: test-in-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Install MySQL client for backup/restore integration
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
      # Deliberately explicit: application startup NEVER runs DDL.
      - name: Initialize disposable CI MySQL from manual SQL
        run: python scripts/init_ci_schema.py
      - run: pytest -q tests/test_mysql_integration.py


  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t pixiv-cache-backend:ci .
      - name: Verify FFmpeg exists in image
        run: docker run --rm --entrypoint ffmpeg pixiv-cache-backend:ci -version
      - name: Verify MySQL backup/restore client exists
        run: |
          docker run --rm --entrypoint sh pixiv-cache-backend:ci -c \
            '(command -v mysqldump || command -v mariadb-dump) && (command -v mysql || command -v mariadb)'
      - name: Verify headless Chromium launches
        run: docker run --rm --entrypoint python pixiv-cache-backend:ci scripts/check_playwright.py
      - name: Verify compose worker config
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Verify archive and maintenance worker heartbeats
        run: |
          set -e
          docker network create pixiv-ci
          trap 'docker rm -f pixiv-ci-worker pixiv-ci-maintenance pixiv-ci-redis >/dev/null 2>&1 || true; docker network rm pixiv-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name pixiv-ci-redis --network pixiv-ci redis:7.4-alpine
          docker run -d --name pixiv-ci-worker --network pixiv-ci \
            -e REDIS_URL=redis://pixiv-ci-redis:6379/0 \
            -e SCHEMA_CHECK_ON_STARTUP=false \
            pixiv-cache-backend:ci python -m app.workers.archive_worker
          archive_ok=0
          for i in $(seq 1 30); do
            if docker exec pixiv-ci-worker python scripts/check_worker_health.py; then
              archive_ok=1
              break
            fi
            sleep 1
          done
          if [ "$archive_ok" != "1" ]; then
            docker logs pixiv-ci-worker
            exit 1
          fi

          docker run -d --name pixiv-ci-maintenance --network pixiv-ci \
            -e REDIS_URL=redis://pixiv-ci-redis:6379/0 \
            -e SCHEMA_CHECK_ON_STARTUP=false \
            -e INTEGRITY_AUDIT_INTERVAL_SECONDS=0 \
            -e WORKER_HEARTBEAT_KEY=pixiv:integrity:worker:healthy \
            pixiv-cache-backend:ci python -m app.workers.integrity_worker
          maintenance_ok=0
          for i in $(seq 1 30); do
            if docker exec pixiv-ci-maintenance python scripts/check_worker_health.py; then
              maintenance_ok=1
              break
            fi
            sleep 1
          done
          if [ "$maintenance_ok" != "1" ]; then
            docker logs pixiv-ci-maintenance
            exit 1
          fi
