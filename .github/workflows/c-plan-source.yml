name: c-plan-source
on:
  push:
    branches: [feature/c-plan-backend-safe-sync]
    paths: [.github/workflows/c-plan-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel --wheel-dir wheelhouse -r requirements.txt 'pytest-asyncio>=0.25,<1' 'aiosqlite>=0.20,<1'
      - uses: actions/upload-artifact@v4
        with:
          name: offline-wheels
          path: wheelhouse/*.whl
          retention-days: 1
